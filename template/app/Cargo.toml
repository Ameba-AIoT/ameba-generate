[package]
name    = "{{project-name}}"
version = "0.1.0"
edition = "2024"

[dependencies]
ameba-rt      = { path = "{{sdk-path}}/ameba-rt" }
ameba-hal     = { path = "{{sdk-path}}/ameba-hal" }
ameba-rom-sys = { path = "{{sdk-path}}/ameba-rom-sys" }

cortex-m    = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

//IF option("embassy")
embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time     = { version = "0.3", features = ["tick-hz-1_000_000"] }
//ENDIF

//IF option("wifi")
ameba-wifi = { path = "{{sdk-path}}/ameba-wifi" }
//ENDIF
